name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest aiohttp
      - run: python -m pytest -q tests
      - name: Kompilacja modułów zależnych od Home Assistanta
        run: |
          for f in custom_components/energa_moj_licznik/*.py; do python -m py_compile "$f"; done
      - run: node --check cards/energa-meter-card.js
